services:
  web:
    build:
      context: .
      target: dev
    container_name: pnnh-web
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_SHOW_DB_TEST: "true"
      ENABLE_DB_DEBUG_ENDPOINT: "true"
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  backend:
    build:
      context: ../backend
    container_name: pnnh-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env.docker
    environment:
      PORT: "4000"
    volumes:
      - ../backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: pnnh-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pnnh-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 256M
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: